        CLUSTER_ID: {{ .Values.siteId | quote }}
        TEMPORAL_SUBSCRIBE_NAMESPACE: {{ .Values.siteId | quote }}
        TEMPORAL_SUBSCRIBE_QUEUE: "site"
        FLOW_GRPC_ENABLED: "false"
